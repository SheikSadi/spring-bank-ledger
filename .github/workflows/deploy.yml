name: Continuous Deployment (AWS ECS Fargate)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build & Deploy to AWS ECR & ECS Fargate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::450963614191:role/spring-bank-ledger-github-actions-role
          aws-region: ap-northeast-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: spring-bank-ledger
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build the Docker image from root Dockerfile
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

          # Push both commit SHA tag and latest tag to Amazon ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy New Image to AWS ECS Fargate
        run: |
          echo "Updating AWS ECS Fargate service with new ECR image..."
          aws ecs update-service \
            --cluster spring-bank-ledger-cluster \
            --service spring-bank-ledger-service \
            --force-new-deployment \
            --region ap-northeast-1
