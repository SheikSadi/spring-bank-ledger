name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Build & Run Test Suite
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE }}
          MYSQL_USER: ${{ vars.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ vars.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ vars.MYSQL_ROOT_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Test Suite with Gradle
        env:
          SPRING_PROFILES_ACTIVE: mysql
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/${{ vars.MYSQL_DATABASE }}?useSSL=false&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: ${{ vars.MYSQL_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ vars.MYSQL_PASSWORD }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ vars.ADMIN_PASSWORD }}
          TEST_EMAIL: ${{ vars.TEST_EMAIL }}
          TEST_PASSWORD: ${{ vars.TEST_PASSWORD }}
          JWT_SECRET: "ci-test-secret-must-be-at-least-256-bits-long"
        run: ./gradlew test
