name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Build & Run Test Suite
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ledger
          MYSQL_USER: ledger_user
          MYSQL_PASSWORD: ledger_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Test Suite with Gradle
        env:
          SPRING_PROFILES_ACTIVE: mysql
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/ledger?useSSL=false&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: ledger_user
          SPRING_DATASOURCE_PASSWORD: ledger_password
        run: ./gradlew test
