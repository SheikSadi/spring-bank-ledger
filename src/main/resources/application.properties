spring.application.name=ledger-api
spring.profiles.active=in-memory

# API defaults
ledger.default-currency=JPY

# Security Credentials & JWT configuration
ledger.security.known-issuer=ledger-api
ledger.security.known-email=${TEST_EMAIL:?Please set TEST_EMAIL in .env}
ledger.security.known-password-hash=${TEST_PASSWORD_HASH:?Please set TEST_PASSWORD_HASH in .env}
ledger.security.known-secret=${JWT_SECRET:?Please set JWT_SECRET in .env}

# Admin credentials
ledger.admin.email=${ADMIN_EMAIL:?Please set ADMIN_EMAIL in .env}
ledger.admin.password-hash=${ADMIN_PASSWORD_HASH:?Please set ADMIN_PASSWORD_HASH in .env}

# Bound for LedgerProperties
ledger.known-email=${TEST_EMAIL:?Please set TEST_EMAIL in .env}

# Enable Virtual Threads to completely maximize Java 25 throughput
spring.threads.virtual.enabled=true

# Actuator exposure
management.endpoints.web.exposure.include=health,info,metrics

# Health Endpoint Detail & Probes
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=True

# Disable unwanted health-checks
management.health.redis.enabled=false
